plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'jacoco'
}
def buildBranch = project.hasProperty("buildBranch") ? project.getProperty("buildBranch") : "main"
def apiUrl = buildBranch == "main" ?
        "https://devcuriousreader.wpcomstaging.com/container_app_manifest/prod/" :
        "https://devcuriousreader.wpcomstaging.com/container_app_manifest/testing_branch/"
task printApiUrl {
    doLast {
        println(apiUrl)
    }
}

android {
    namespace 'org.curiouslearning.container'
    compileSdk 35
    packagingOptions {
        pickFirst "lib/x86/libc++_shared.so"
        pickFirst "lib/x86_64/libc++_shared.so"
        pickFirst "lib/armeabi-v7a/libc++_shared.so"
        pickFirst "lib/arm64-v8a/libc++_shared.so"
    }
    defaultConfig {
        applicationId "org.curiouslearning.container"
        minSdk 24
        targetSdk 35
        versionCode 83
        versionName "2.34.10"
        

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }

    buildFeatures {
        dataBinding true
        viewBinding true
        buildConfig = true
    }

    flavorDimensions "mode"

    def standaloneFeatureFlags = [
            standard  : [
                    ENABLE_FACEBOOK                     : true,
                    ENABLE_SENTRY                       : true,
                    ENABLE_REMOTE_MANIFEST              : true,
                    ENABLE_INSTALL_REFERRER             : true,
                    REQUIRE_INTERNET_FOR_UNCACHED_CONTENT: true,
                    ALLOW_BACK_NAVIGATION               : true,
                    SHOW_WEBAPP_CLOSE_BUTTON            : true,
                    SHOW_LANGUAGE_POPUP                 : true,
                    SHOW_SETTINGS_BUTTON                : true
            ],
            standalone: [
                    ENABLE_FACEBOOK                     : false,
                    ENABLE_SENTRY                       : false,
                    ENABLE_REMOTE_MANIFEST              : false,
                    ENABLE_INSTALL_REFERRER             : false,
                    REQUIRE_INTERNET_FOR_UNCACHED_CONTENT: false,
                    ALLOW_BACK_NAVIGATION               : false,
                    SHOW_WEBAPP_CLOSE_BUTTON            : false,
                    SHOW_LANGUAGE_POPUP                 : false,
                    SHOW_SETTINGS_BUTTON                : false
            ]
    ]

    // Standalone builds skip the language popup entirely, so they need a language to load
    // by default. Set by the standalone build orchestrator skill via
    // -PstandaloneDefaultLanguage=<languageInEnglishName>, matching the manifest's
    // languageInEnglishName (e.g. "Zulu"), which is what WebAppDao.getSelectedlanguageWebApps
    // matches against.
    def standaloneDefaultLanguage = project.hasProperty("standaloneDefaultLanguage") ?
            project.getProperty("standaloneDefaultLanguage") : ""

    productFlavors {
        standard {
            dimension "mode"
            standaloneFeatureFlags.standard.each { flagName, flagValue ->
                buildConfigField "boolean", flagName, flagValue.toString()
            }
            buildConfigField "String", "DEFAULT_LANGUAGE", "\"\""
        }
        standalone {
            dimension "mode"
            applicationId "org.curiouslearning.container"
            standaloneFeatureFlags.standalone.each { flagName, flagValue ->
                buildConfigField "boolean", flagName, flagValue.toString()
            }
            buildConfigField "String", "DEFAULT_LANGUAGE", "\"${standaloneDefaultLanguage}\""
        }
    }

    testOptions {
        unitTests.all { test ->
            jacoco {
                includeNoLocationClasses = true
                excludes = ['jdk.internal.*']
                destinationFile = file("$buildDir/jacoco/${test.name}.exec")
            }
        }
    }

    signingConfigs {
        release {
            storeFile file("keystore/my-release-key.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        debug{
            testCoverageEnabled true
            buildConfigField "String", "API_URL", "\"https://devcuriousreader.wpcomstaging.com/container_app_manifest/testing_branch/\""
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "API_URL", "\"${apiUrl}\""
        }
    }
    compileOptions {
        // remove when we move to SDK 26 or higher
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {

    // remove when we move to SDK 26 or higher
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

    //retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    implementation platform("org.jetbrains.kotlin:kotlin-bom:1.8.22")
    //RoomDatabase
    implementation "androidx.room:room-runtime:2.3.0"
    annotationProcessor "androidx.room:room-compiler:2.3.0"

    //lifecycle-Viewmodal
    implementation "androidx.lifecycle:lifecycle-viewmodel:2.5.1"

    //firebase
    implementation platform('com.google.firebase:firebase-bom:31.2.3')
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics:18.6.1'
    implementation 'com.google.firebase:firebase-core:17.5.0'

    //picasso (image caching)
    implementation 'com.squareup.picasso:picasso:2.71828'

    //install refferal
    implementation "com.android.installreferrer:installreferrer:2.2"

    implementation 'androidx.appcompat:appcompat:1.5.1'
    implementation 'com.google.android.material:material:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.webkit:webkit:1.15.0'
    standardImplementation(platform("io.sentry:sentry-bom:7.17.0"))
    standardImplementation("io.sentry:sentry-android") {
        exclude group: "io.sentry", module: "sentry-android-ndk"
    }
    // Source: https://mvnrepository.com/artifact/app.rive/rive-android
    implementation 'app.rive:rive-android:10.4.4'
    // For initialization, you may want to add a dependency on Jetpack Startup
    implementation "androidx.startup:startup-runtime:1.1.1"
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.10.3'
    testImplementation 'org.mockito:mockito-core:4.11.0'
    testImplementation 'org.mockito:mockito-inline:4.11.0'
    testImplementation 'androidx.test:core:1.5.0'


    androidTestImplementation 'androidx.test:core:1.5.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.test.espresso:espresso-contrib:3.5.1'
    androidTestImplementation 'org.mockito:mockito-android:4.11.0'

    implementation 'com.facebook.android:facebook-android-sdk:17.0.0'
}
jacoco {
    toolVersion = "0.8.10" // or latest stable version
}

def coverageSourceDirs = [
        "src/main/java"
]

task jacocoTestReport(type: JacocoReport, dependsOn: ['testDebugUnitTest']) {
    group = "Reporting"
    description = "Generate Jacoco coverage reports after running tests."

    reports {
        xml.required = true
        html.required = true
    }

    classDirectories.setFrom(fileTree(
            dir: "$buildDir/intermediates/classes/debug/transformDebugClassesWithAsm/dirs",
            excludes: [
                    '**/R.class',
                    '**/R$*.class',
                    '**/BuildConfig.*',
                    '**/Manifest*.*',
                    '**/*Test*.*',
                    '**/databinding/*',
                    '**/android/databinding/*',
                    '**/androidx/**',
                    '**/*$ViewInjector*.*',
                    '**/*$ViewBinder*.*'
            ]
    ))

    sourceDirectories.setFrom(files(coverageSourceDirs))
    executionData.setFrom(files(
            "$buildDir/jacoco/testDebugUnitTest.exec",
            "$buildDir/outputs/code-coverage/connected/*coverage.ec"
    ))
}
tasks.register("verifyStandaloneConfiguration") {
    group = "Verification"
    description = "Checks the standalone flavor and its feature gates."

    doLast {
        def standaloneFlavor = android.productFlavors.find { it.name == "standalone" }
        if (standaloneFlavor == null) {
            throw new GradleException("Missing standalone product flavor.")
        }

        def expectedFlags = [
                ENABLE_FACEBOOK                     : "false",
                ENABLE_SENTRY                       : "false",
                ENABLE_REMOTE_MANIFEST              : "false",
                ENABLE_INSTALL_REFERRER             : "false",
                REQUIRE_INTERNET_FOR_UNCACHED_CONTENT: "false",
                ALLOW_BACK_NAVIGATION               : "false",
                SHOW_WEBAPP_CLOSE_BUTTON            : "false",
                SHOW_LANGUAGE_POPUP                 : "false",
                SHOW_SETTINGS_BUTTON                : "false"
        ]

        expectedFlags.each { flagName, expectedValue ->
            def actualValue = standaloneFlavor.buildConfigFields[flagName]?.value?.toString()
            if (actualValue == null) {
                throw new GradleException("Standalone flavor is missing BuildConfig flag ${flagName}.")
            }
            if (actualValue != expectedValue) {
                throw new GradleException("Standalone flavor flag ${flagName} expected ${expectedValue} but was ${actualValue}.")
            }
        }

        def defaultLanguageField = standaloneFlavor.buildConfigFields["DEFAULT_LANGUAGE"]?.value?.toString()
        if (defaultLanguageField == null) {
            throw new GradleException("Standalone flavor is missing BuildConfig field DEFAULT_LANGUAGE.")
        }
        if (defaultLanguageField == "\"\"") {
            println("WARNING: Standalone DEFAULT_LANGUAGE is empty. SHOW_LANGUAGE_POPUP is false, so the app " +
                    "will load an empty app list unless -PstandaloneDefaultLanguage=<languageInEnglishName> is set.")
        }

        if (!file("src/standalone/AndroidManifest.xml").exists()) {
            throw new GradleException("Missing standalone manifest overlay at app/src/standalone/AndroidManifest.xml.")
        }

        // WebApp.java's loadWebView() uses androidx.webkit.WebViewAssetLoader to serve bundled
        // CRWebPlayerJs/BookContent from app assets. Standalone has no network fallback, so this
        // dependency is required (not optional) even though it looks similar to the
        // Facebook/Sentry/Install-Referrer dependencies that standalone cleanup removes.
        def webkitDependency = configurations.getByName("implementation").allDependencies.find {
            it.group == "androidx.webkit" && it.name == "webkit"
        }
        if (webkitDependency == null) {
            throw new GradleException("Missing androidx.webkit:webkit dependency required by WebApp.java's " +
                    "WebViewAssetLoader for standalone offline content loading.")
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}
