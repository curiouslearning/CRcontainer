plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'jacoco'

    id 'io.sentry.android.gradle' version '5.10.0'
}
def buildBranch = project.hasProperty("buildBranch") ? project.getProperty("buildBranch") : "main"
def apiUrl = buildBranch == "main" ?
        "https://devcuriousreader.wpcomstaging.com/container_app_manifest/prod/" :
        "https://devcuriousreader.wpcomstaging.com/container_app_manifest/prod/"
task printApiUrl {
    doLast {
        println(apiUrl)
    }
}

android {
    namespace 'org.curiouslearning.container'
    compileSdk 35
    defaultConfig {
        applicationId "org.curiouslearning.container"
        minSdk 24
        targetSdk 35
        versionCode 85
        versionName "2.34.3"
        

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }

    buildFeatures {
        dataBinding true
        viewBinding true
        buildConfig = true
    }

    signingConfigs {
        release {
            storeFile file("keystore/my-release-key.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        debug{
            buildConfigField "String", "API_URL", "\"https://devcuriousreader.wpcomstaging.com/container_app_manifest/prod/\""
            enableUnitTestCoverage true
            enableAndroidTestCoverage true
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "API_URL", "\"${apiUrl}\""
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
            pickFirsts += ['lib/x86/libc++_shared.so', 'lib/x86_64/libc++_shared.so', 'lib/armeabi-v7a/libc++_shared.so', 'lib/arm64-v8a/libc++_shared.so']
        }
    }
}

dependencies {

    // Retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'

    implementation platform("org.jetbrains.kotlin:kotlin-bom:1.9.24")

    // Room Database
    implementation "androidx.room:room-runtime:2.6.1"
    annotationProcessor "androidx.room:room-compiler:2.6.1"

    // Lifecycle / ViewModel
    implementation "androidx.lifecycle:lifecycle-viewmodel:2.8.7"
    implementation "androidx.lifecycle:lifecycle-livedata:2.8.7"

    // Firebase (firebase-core is deprecated — analytics covers everything)
    implementation platform('com.google.firebase:firebase-bom:33.1.0')
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'

    // Picasso (image caching)
    implementation 'com.squareup.picasso:picasso:2.71828'

    // Install referrer
    implementation "com.android.installreferrer:installreferrer:2.2"

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation(platform("io.sentry:sentry-bom:7.17.0"))
    implementation("io.sentry:sentry-android") {
        exclude group: "io.sentry", module: "sentry-android-ndk"
    }
    // Rive animations
    implementation 'app.rive:rive-android:10.4.4'
    implementation "androidx.startup:startup-runtime:1.2.0"

    // Test dependencies
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testImplementation 'org.mockito:mockito-inline:5.2.0'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'

    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-contrib:3.6.1'
    androidTestImplementation 'org.mockito:mockito-android:5.12.0'

    implementation 'com.facebook.android:facebook-android-sdk:17.0.0'
}
jacoco {
    toolVersion = "0.8.10" // or latest stable version
}

def coverageSourceDirs = [
        "src/main/java"
]

tasks.register("jacocoTestReport", JacocoReport) {
    dependsOn('testDebugUnitTest')
    group = "Reporting"
    description = "Generate Jacoco coverage reports after running tests."

    reports {
        xml.required = true
        html.required = true
    }

    def excludes = [
            '**/R.class',
            '**/R$*.class',
            '**/BR.class',
            '**/BR$*.class',
            '**/BuildConfig.*',
            '**/Manifest*.*',
            '**/*Test*.*',
            '**/databinding/*',
            '**/android/databinding/*',
            '**/androidx/**',
            '**/*$ViewInjector*.*',
            '**/*$ViewBinder*.*',
            '**/DataBinderMapperImpl*.*',
            '**/DataBindingInfo.*'
    ]

    classDirectories.setFrom(fileTree(
            dir: layout.buildDirectory.dir("intermediates/javac/debug/compileDebugJavaWithJavac/classes"),
            excludes: excludes
    ))

    sourceDirectories.setFrom(files(coverageSourceDirs))
    executionData.setFrom(fileTree(dir: layout.buildDirectory, includes: [
            "jacoco/testDebugUnitTest.exec",
            "outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec",
            "outputs/code-coverage/connected/*coverage.ec"
    ]))
}



sentry {
    org = "curious-learning"
    projectName = "cr-container"

    // this will upload your source code to Sentry to show it as part of the stack traces
    // disable if you don't want to expose your sources
    includeSourceContext = true
}
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}
