plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'jacoco'
    id 'io.sentry.android.gradle' version '5.10.0'
}
def buildBranch = project.hasProperty("buildBranch") ? project.getProperty("buildBranch") : "main"

// Developer-local settings (gitignored). Absent on CI, so anything read from here is always
// empty in a distributed APK. See local.properties.example.
def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}

def apiUrl = buildBranch == "main" ?
        "https://devcuriousreader.wpcomstaging.com/container_app_manifest/prod/" :
        "https://devcuriousreader.wpcomstaging.com/container_app_manifest/testing_branch/"
task printApiUrl {
    doLast {
        println(apiUrl)
    }
}

android {
    namespace 'org.curiouslearning.container'
    compileSdk = 36
    packagingOptions {
        pickFirst "lib/x86/libc++_shared.so"
        pickFirst "lib/x86_64/libc++_shared.so"
        pickFirst "lib/armeabi-v7a/libc++_shared.so"
        pickFirst "lib/arm64-v8a/libc++_shared.so"
    }
    defaultConfig {
        applicationId "org.curiouslearning.container"
        minSdk = 24
        targetSdk = 36
        versionCode 93
        versionName "2.34.7"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }

        // ipinfo.io Lite token — same public token shipped in the assessment-survey-js web bundle
        buildConfigField "String", "IPINFO_TOKEN", "\"b6268727178610\""

        // Local sub-app dev redirect, consumed by WebAppsAdapter.maybeOverrideAppUrlForLocalDev().
        // Empty here so release builds compile and never redirect; the debug buildType below
        // fills these from the developer's own (gitignored) local.properties, which means they
        // are always empty on CI -> the redirect is inert in every distributed APK.
        // See local.properties.example and the test-subapp-locally skill.
        buildConfigField "String", "LOCAL_SUBAPP_MATCH_HOSTS", "\"\""
        buildConfigField "String", "LOCAL_SUBAPP_REPLACEMENT_ORIGIN", "\"\""
    }

    buildFeatures {
        dataBinding true
        viewBinding true
        buildConfig = true
    }

    // Distribution flavors.
    //
    //  online     - the regular Play Store build. Catalog comes from the remote manifest (API_URL),
    //               sub-apps load from their deployed URLs. Identical to the app before flavors
    //               existed; every BuildConfig flag below is inert here.
    //  mwfCongo   - MWF PDE standalone APK for the Republic of Congo (French + English).
    //  mwfAngola  - MWF PDE standalone APK for Angola (Brazilian Portuguese + English).
    //
    // The two mwf* flavors are fully offline from first launch: the catalog is the bundled
    // web_apps_manifest.json in the flavor's assets, icons and Feed The Monster are packaged in
    // the APK (src/mwfShared/assets) and served through WebViewAssetLoader, and nothing on the
    // startup path waits on the network. They deliberately share applicationId with `online`
    // because google-services.json (Firebase) and the Literacy Coach data pipeline are keyed on
    // the package name.
    flavorDimensions "distribution"
    productFlavors {
        online {
            dimension "distribution"
            isDefault = true
            buildConfigField "boolean", "OFFLINE_STANDALONE", "false"
        }
        // No language is preselected in the standalone flavors: a fresh install shows the language
        // dropdown (packaged languages only) and remembers the choice like the online app.
        mwfCongo {
            dimension "distribution"
            buildConfigField "boolean", "OFFLINE_STANDALONE", "true"
        }
        mwfAngola {
            dimension "distribution"
            buildConfigField "boolean", "OFFLINE_STANDALONE", "true"
        }
    }

    sourceSets {
        // Assets common to every standalone flavor (icons, the packaged FTM build). Each flavor's
        // own src/<flavor>/assets adds its web_apps_manifest.json on top and overrides main's.
        // src/mwfShared/java holds the standalone twins of the flavor-specific classes that the
        // online flavor implements with the Facebook SDK, the Play Install Referrer and Sentry
        // (integrations/AppIntegrations, integrations/CrashReporter, LaunchAttribution). The
        // online versions live in the conventional src/online/java.
        mwfCongo {
            assets.srcDirs += ['src/mwfShared/assets']
            java.srcDirs += ['src/mwfShared/java']
        }
        mwfAngola {
            assets.srcDirs += ['src/mwfShared/assets']
            java.srcDirs += ['src/mwfShared/java']
        }
    }

    testOptions {
        unitTests.all { test ->
            jacoco {
                includeNoLocationClasses = true
                excludes = ['jdk.internal.*']
                destinationFile = file("$buildDir/jacoco/${test.name}.exec")
            }
        }
    }

    signingConfigs {
        release {
            storeFile file("keystore/my-release-key.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        debug{
            testCoverageEnabled true
            buildConfigField "String", "API_URL", "\"https://devcuriousreader.wpcomstaging.com/container_app_manifest/testing_branch/\""
            // Local sub-app dev redirect — values come from local.properties (gitignored, never
            // committed, absent on CI). Copy local.properties.example to set them up.
            buildConfigField "String", "LOCAL_SUBAPP_MATCH_HOSTS",
                    "\"${localProps.getProperty('localSubappMatchHosts', '')}\""
            buildConfigField "String", "LOCAL_SUBAPP_REPLACEMENT_ORIGIN",
                    "\"${localProps.getProperty('localSubappReplacementOrigin', '')}\""
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "API_URL", "\"${apiUrl}\""
        }
    }
    compileOptions {
        // remove when we move to SDK 26 or higher
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {

    // remove when we move to SDK 26 or higher
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

    //retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    implementation platform("org.jetbrains.kotlin:kotlin-bom:1.8.22")
    //RoomDatabase
    implementation "androidx.room:room-runtime:2.3.0"
    annotationProcessor "androidx.room:room-compiler:2.3.0"

    //lifecycle-Viewmodal
    implementation "androidx.lifecycle:lifecycle-viewmodel:2.5.1"

    //firebase
    implementation platform('com.google.firebase:firebase-bom:31.2.3')
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics:18.6.1'
    implementation 'com.google.firebase:firebase-core:17.5.0'

    //picasso (image caching)
    implementation 'com.squareup.picasso:picasso:2.71828'

    // Play Install Referrer: online flavor only (sideloaded standalone builds have no referrer).
    onlineImplementation "com.android.installreferrer:installreferrer:2.2"
    implementation 'com.google.zxing:core:3.4.1'
    implementation 'androidx.appcompat:appcompat:1.5.1'
    // WebViewAssetLoader + service-worker interception for sub-apps packaged in the APK
    // (offline standalone flavors). See utilities/LocalWebContent.
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'com.google.android.material:material:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    // Sentry: online flavor only. The standalone flavors report nothing to Sentry and do not
    // ship the SDK (see integrations/CrashReporter in each flavor source set).
    onlineImplementation(platform("io.sentry:sentry-bom:7.17.0"))
    onlineImplementation("io.sentry:sentry-android") {
        exclude group: "io.sentry", module: "sentry-android-ndk"
    }
    // Source: https://mvnrepository.com/artifact/app.rive/rive-android
    implementation 'app.rive:rive-android:10.4.4'
    // For initialization, you may want to add a dependency on Jetpack Startup
    implementation "androidx.startup:startup-runtime:1.1.1"
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.10.3'
    testImplementation 'org.mockito:mockito-core:4.11.0'
    testImplementation 'org.mockito:mockito-inline:4.11.0'
    testImplementation 'androidx.test:core:1.5.0'


    androidTestImplementation 'androidx.test:core:1.5.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.test.espresso:espresso-contrib:3.5.1'
    androidTestImplementation 'org.mockito:mockito-android:4.11.0'

    // Facebook SDK (deferred deep links, app events): online flavor only.
    onlineImplementation 'com.facebook.android:facebook-android-sdk:17.0.0'
}
jacoco {
    toolVersion = "0.8.10" // or latest stable version
}

def coverageSourceDirs = [
        "src/main/java"
]

task jacocoTestReport(type: JacocoReport, dependsOn: ['testOnlineDebugUnitTest']) {
    group = "Reporting"
    description = "Generate Jacoco coverage reports after running tests."

    reports {
        xml.required = true
        html.required = true
    }

    classDirectories.setFrom(fileTree(
            dir: "$buildDir/intermediates/classes/onlineDebug/transformOnlineDebugClassesWithAsm/dirs",
            excludes: [
                    '**/R.class',
                    '**/R$*.class',
                    '**/BuildConfig.*',
                    '**/Manifest*.*',
                    '**/*Test*.*',
                    '**/databinding/*',
                    '**/android/databinding/*',
                    '**/androidx/**',
                    '**/*$ViewInjector*.*',
                    '**/*$ViewBinder*.*'
            ]
    ))

    sourceDirectories.setFrom(files(coverageSourceDirs))
    executionData.setFrom(files(
            "$buildDir/jacoco/testOnlineDebugUnitTest.exec",
            "$buildDir/outputs/code-coverage/connected/*coverage.ec"
    ))
}


sentry {
    org = "curious-learning"
    projectName = "cr-container"

    // The offline standalone flavors do not ship the Sentry SDK at all, so skip their bytecode
    // instrumentation and source/mapping uploads, and stop the plugin from adding the SDK
    // dependency to every variant (it is declared as onlineImplementation above).
    ignoredFlavors = ["mwfCongo", "mwfAngola"]
    autoInstallation {
        enabled = false
    }

    // this will upload your source code to Sentry to show it as part of the stack traces
    // disable if you don't want to expose your sources
    includeSourceContext = true
}
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}
