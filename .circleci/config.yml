version: 2.1

executors:
  android-executor:
    docker:
      - image: cimg/android:2023.10

jobs:
  deploy:
    executor: android-executor
    working_directory: ~/project
    steps:
      - checkout

      - run:
          name: Install Bundler & Fastlane plugins
          command: |
            sudo apt-get update && sudo apt-get install -y libyaml-dev

            # Print the toolchain versions up front. This image ships Ruby 3.0;
            # if that ever changes, this line is the first place it shows.
            ruby -v

            # Pin Bundler instead of taking whatever is newest today.
            sudo gem install bundler -v '~> 2.5'
            bundle -v

            cd app

            # `bundle install --path` is deprecated (it relies on state being
            # remembered between invocations). The config form is the supported
            # replacement and is scoped to this checkout.
            bundle config set --local path 'vendor/bundle'
            bundle install

            # Guard rail: prove that real fastlane got installed. The previous
            # failure resolved to the placeholder gem "fastlane 0.0.1"; this
            # line would have caught that in seconds instead of minutes.
            bundle exec fastlane --version

      - run:
          name: Make gradlew executable
          command: chmod +x ./gradlew

      - run:
          name: Decode Keystore
          command: |
            echo $KEYSTORE_BASE64 | base64 --decode > app/keystore/my-release-key.jks

      - run:
          name: Decode Service Account JSON
          command: |
            echo $JSON_KEY_DATA | base64 --decode > app/fastlane/service-account.json

      - run:
          name: Inject AES Key for Slack Decryption
          command: |
            if git log -1 --pretty=%B | grep -qi "release" && { [ "$CIRCLE_BRANCH" = "develop" ] || [ "$CIRCLE_BRANCH" = "main" ]; }; then
              mkdir -p app/src/main/assets
              echo "SLACK_AES_KEY=$SLACK_AES_KEY" > app/src/main/assets/config.properties
              echo "🔐 AES key injected (encrypted webhook remains inside APK)"
            else
              echo "⚠️ Skipping Slack webhook URL injection (without release commit)."
            fi

      # 🟣 Install Sentry CLI
      - run:
          name: Install Sentry CLI
          command: |
            curl -sL https://sentry.io/get-cli/ | bash
            sentry-cli --version

      # 🟣 Create Sentry release (before Fastlane)
      - run:
          name: Create Sentry Release
          command: |
            export SENTRY_AUTH_TOKEN=$SENTRY_AUTH_TOKEN
            export SENTRY_ORG=$SENTRY_ORG
            export SENTRY_PROJECT=$SENTRY_PROJECT

            VERSION_NAME=$(grep versionName app/build.gradle | awk '{print $2}' | tr -d '"')

      - run:
          name: Fetch full git history for Sentry
          command: git fetch --unshallow || git fetch --all --tags
      # 🟣 Run Fastlane (handles build + upload + release)
      - run:
          name: Run Fastlane
          command: |
            cd app
            bundle exec fastlane deploy



workflows:
  deploy_on_branch:
    jobs:
      - deploy:
          filters:
            branches:
              only:
                - develop
                - main
